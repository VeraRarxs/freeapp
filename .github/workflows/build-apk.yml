name: Build APK

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm install --no-audit --no-fund
          npx cap sync android
          D=android/capacitor-cordova-android-plugins
          if [ ! -d "$D" ]; then
          mkdir -p "$D/src/main"
          cat > "$D/build.gradle" <<'EOF'
          apply plugin: 'com.android.library'
          android {
            namespace "capacitor.cordova.android.plugins"
            compileSdkVersion rootProject.ext.compileSdkVersion
            defaultConfig {
              minSdkVersion rootProject.ext.minSdkVersion
              targetSdkVersion rootProject.ext.targetSdkVersion
            }
          }
          repositories { flatDir { dirs 'src/main/libs' } }
          dependencies { implementation fileTree(dir: 'src/main/libs', include: ['*.jar']) }
          EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/**/outputs/apk/**/*.apk
